apply plugin: 'com.android.application'

android {
    //compileSdkVersion 23

    defaultConfig {
        applicationId "org.apertium.android"
        //minSdkVersion 7
        //targetSdkVersion 23
        minSdk = 23 // or higher depending on your target devices
        targetSdk = 23 // or higher depending on your target devices
        compileSdk = 23 // or higher depending on your target devices
    }

    android {
        lintOptions {
//            checkReleaseBuilds false
            // Or, if you prefer, you can continue to check for errors in release builds,
            // but continue the build even when errors are found:
            abortOnError false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-project.txt'
        }
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.code.gson:gson:2.9.0'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:3.10.0'
}

dependencies {
    compile files('libs/lttoolbox.jar')
}
